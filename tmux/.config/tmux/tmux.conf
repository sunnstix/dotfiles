# ============================================================================
#  ~/.config/tmux/tmux.conf   (stow package: tmux)   — tmux 3.x
# ============================================================================

# ---- Core behavior --------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"   # true color
set -g  mouse on
set -g  escape-time 0            # no lag for <Esc> in neovim
set -g  focus-events on          # let nvim know when tmux pane is focused
set -g  history-limit 100000
set -g  set-clipboard on
set -g  allow-passthrough on     # pass OSC 8 hyperlinks through to Ghostty
setw -g mode-keys vi             # vi keys in copy-mode

# 1-based numbering, auto-renumber when a window closes
set -g  base-index 1
setw -g pane-base-index 1
set -g  renumber-windows on

# ---- Prefix: Ctrl-a (easier than Ctrl-b) ----------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix             # press C-a twice to send a literal C-a

# ---- Reload config: prefix + r --------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded ✔"

# ---- Toggle mouse mode: prefix + m  (mouse OFF = native terminal select) ---
bind m set -g mouse \; display "mouse #{?mouse,on,off}"

# ---- Splits keep the current directory; intuitive | and - -----------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind c new-window -c "#{pane_current_path}"

# ---- Pane resizing: prefix + H/J/K/L (repeatable) -------------------------
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ---- Copy-mode like vim ---------------------------------------------------
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle

# ============================================================================
#  Plugins (TPM)   — install/update with prefix + I  /  prefix + U
# ============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'        # universally-agreeable defaults
set -g @plugin 'christoomey/vim-tmux-navigator'    # Ctrl-h/j/k/l moves across nvim+tmux panes
set -g @plugin 'tmux-plugins/tmux-yank'            # better clipboard integration
set -g @plugin 'wfxr/tmux-fzf-url'                # prefix + u → fzf-pick a URL and open it
set -g @plugin 'tmux-plugins/tmux-resurrect'       # save/restore sessions (prefix C-s / C-r)
set -g @plugin 'tmux-plugins/tmux-continuum'       # auto-save every 15 min + auto-restore

# resurrect/continuum: persist neovim sessions + restore on tmux start
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# ---- Theme: Catppuccin Mocha ----------------------------------------------
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_number_position 'right'
set -g @catppuccin_window_default_text ' #W'
set -g @catppuccin_window_current_text ' #W'

# Build the status bar (catppuccin v2 module syntax)
set -g status-position top
set -g status-interval 5
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_directory}"
set -ag  status-right "#{E:@catppuccin_status_date_time}"
set -g @catppuccin_date_time_text " %H:%M "

# ---- Initialize TPM (KEEP THIS LAST) --------------------------------------
run '~/.config/tmux/plugins/tpm/tpm'
