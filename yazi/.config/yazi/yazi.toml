# ~/.config/yazi/yazi.toml   (stow package: yazi)   — yazi 25+/26 uses [mgr]
[mgr]
ratio          = [1, 3, 4]   # parent | current | preview
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
linemode       = "size"
show_hidden    = false       # toggle live with `.`
show_symlink   = true

[preview]
tab_size   = 2
max_width  = 600
max_height = 900

[opener]
edit = [
  { run = 'nvim "$@"', block = true, for = "unix" },
]
open = [
  { run = 'xdg-open "$@"', desc = "Open", for = "linux" },
  { run = 'open "$@"',     desc = "Open", for = "macos" },
]

[open]
rules = [
  { name = "*/", use = [ "edit", "open" ] },
  { mime = "text/*", use = [ "edit" ] },
  { mime = "application/json", use = [ "edit" ] },
  { mime = "*", use = [ "open" ] },
]
