default: false   # opt-in only — style rules disabled entirely

# Broken syntax that won't render correctly
MD011: true   # reversed link syntax: (text)[url] instead of [text](url)
MD037: true   # spaces inside emphasis markers: * text * won't render
MD038: true   # spaces inside code span: ` text ` won't render
MD039: true   # spaces inside link text: [ text](url) won't render
MD042: true   # empty links: [text]() or [text][ref] with no destination
MD051: true   # invalid heading fragment in link: [text](#nonexistent)
MD052: true   # undefined reference link/image label
